[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assist"
version = "2.1.0"
description = "Evidence-first five-agent research assistant with a local web workspace"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1", "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2", "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<2"]
local-models = ["sentence-transformers>=4.1,<6"]
training = ["sentence-transformers>=4.1,<6", "datasets>=3,<5", "accelerate>=1,<2"]

[project.scripts]
research-assist = "research_assist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_assist = ["web/*", "sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research_assist"]
ignore_missing_imports = true

