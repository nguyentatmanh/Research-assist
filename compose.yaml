services:
  research-assist:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      RA_HOST: 0.0.0.0
      RA_DATA_DIR: /app/data
    volumes:
      - research-data:/app/data
      - ./models:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  research-data:
